server:
  port: 8083

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

api:
  key: ${APPOINTMENT_SERVICE_API_KEY:appointment-service-key-2026}

# pet-service connection details, used to validate petId on booking
pet-service:
  base-url: ${PET_SERVICE_URL:http://localhost:8082}
  api-key: ${PET_SERVICE_API_KEY:pet-service-key-2026}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
