server:
  port: 8081

spring:
  application:
    name: owner-auth-service
  datasource:
    url: jdbc:h2:mem:ownerdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Key the API Gateway must send as X-API-KEY on every proxied request.
# Also used by other services (pet-service) when calling this service directly.
api:
  key: ${OWNER_SERVICE_API_KEY:owner-service-key-2026}

# Shared secret used to sign JWTs. The API Gateway must use the SAME secret
# to validate tokens issued here (see api-gateway application.yml).
jwt:
  secret: ${JWT_SECRET:pet-mgmt-super-secret-key-change-in-production-2026}
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
