server:
  port: 8084

spring:
  application:
    name: medical-record-service
  datasource:
    url: jdbc:h2:mem:recorddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

api:
  key: ${RECORD_SERVICE_API_KEY:medical-record-service-key-2026}

# appointment-service connection details, used to validate appointmentId
appointment-service:
  base-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
  api-key: ${APPOINTMENT_SERVICE_API_KEY:appointment-service-key-2026}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
